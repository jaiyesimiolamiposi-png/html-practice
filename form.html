<!DOCTYPE html>
<html>
    <head>
        <title>Student Reistration Form </title>
    </head>
    <body>
        <h1>STUDENT REGISTRATION FORM</h1>

        <form>
            
        <div name="Personal details">
            <h4>Step 1: Your Details</h4>
            <label for="name">Name
                <input type="text" name="name" placeholder="Firstname and Lastname">
            </label>
            <br><br>
            <label for="email">Email
                <input type="email" name="email" placeholder="example@domain.com">
            </label>
            <br><br>
            <label for="phone">Phone
                <input type="tel" name="phone" placeholder="Eg 08012345678">
            </label>
        <br><br>
        <label for="courses">
                <ul>
                    <li>gst 101<input type="radio" name="general studies" placeholder="gst101"></li>
                    <li>csc 101<input type="radio" name="introduction to computer" placeholder="csc101"></li>
                </ul>
        </label>
        <br><br>
        <button type="submit">Submit</button>
        </div>
        

        </form>
    </body>
</html>
